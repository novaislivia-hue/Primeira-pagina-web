<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header{
            background-color: #183C63;
            color: #FFFFFF; 
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;                
            }
            main {
                background-color: #FFFFFF;
                color: #183C63;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 80px;
                height: 80px;
            }
            .artigo-autor{
                font-weight: bold;
            }

        </style>
    </head>
    <body>
        <header> 
            <h1>Clube de Leitura da Lívia</h1>
            <p>Vou compartilhar minha opinião sobre diversos livros </p>
        </header>
        <main>
            <img src="imagem-blog.png" alt="Uma imagem ícone quadrada 80x80 pixels em azul escuro profundo para um blog de livros. No centro, há uma pilha de três livros azuis estilizados e minimalistas. O livro do topo é azul-claro com a palavra 'LEITURA' e um pequeno ícone dourado; o do meio é azul-médio com um marcador de páginas dourado; e o de baixo é azul-marinho. Acima da pilha, há um arco sutil de pequenas estrelas douradas e azuis. O fundo é um azul escuro sólido com cantos arredondados, projetado para clareza como um ícone pequeno.">
            <div>

                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Lívia Hey</p>
                <p>Boas vindas ao meu blog! Aqui eu vou compartilhar dicas e minhas opiniões sobre livros.</p>
                <button>💙 <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>

        </main>
    </body>
    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach( function(botao){
            let curtiu = false;
            botao.addEventListener("click", botaoClicado);
            function botaoClicado(){
               console.log("fui clicado");
               let texto = botao.querySelector("span");
               if (curtiu === false){
                   texto.textContent++;
                   curtiu = true; 
               } else{
                texto.textContent--;
                curtiu = false;
               }
            }
        })



    </script>
</html>
